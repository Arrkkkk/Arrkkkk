    <stop offset=".35" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#fff" stop-opacity=".6"/>
  </linearGradient>
  <mask id="dotmask"><rect width="960" height="320" fill="url(#fadeR)"/></mask>
  <clipPath id="card"><rect x=".5" y=".5" width="959" height="319" rx="18"/></clipPath>
</defs>
