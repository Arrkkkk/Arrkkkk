<svg xmlns="http://www.w3.org/2000/svg" width="960" height="320" viewBox="0 0 960 320" role="img" aria-labelledby="t d">
<title id="t">Rajit Agrawal</title>
<desc id="d">Building dependable software where AI meets finance. B.Tech CSE at VIT Vellore, class of 2027, CGPA 9.74.</desc>
<style>
  .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; }
  .mono { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; }
  .cursor { animation: blink 1.1s steps(1) infinite; }
  .trace { stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw 2.4s cubic-bezier(.65,0,.35,1) .3s forwards; }
  .fill { opacity: 0; animation: fade 1s ease-out 2.2s forwards; }
  .tip { opacity: 0; animation: fade .4s ease-out 2.6s forwards; }
  .pulse { transform-origin: 900.0px 124.0px; animation: pulse 2s ease-out 2.7s infinite; opacity: 0; }
  @keyframes blink { 50% { opacity: 0; } }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  @keyframes fade { to { opacity: 1; } }
  @keyframes pulse { 0% { transform: scale(1); opacity: .55; } 100% { transform: scale(3.2); opacity: 0; } }
  @media (prefers-reduced-motion: reduce) {
    .cursor, .pulse { animation: none; }
    .trace { animation: none; stroke-dashoffset: 0; }
    .fill, .tip { animation: none; opacity: 1; }
  }
</style>
<defs>
  <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#D0D7DE"/></pattern>
  <linearGradient id="area" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#BF8700" stop-opacity=".28"/><stop offset="1" stop-color="#BF8700" stop-opacity="0"/>
